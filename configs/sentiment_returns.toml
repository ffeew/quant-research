# Trial config. Strategy parameters are frozen (pre-registered) constants in the code;
# this file records the entry point, status and data needs.

[trial]
title = "AV news sentiment -> returns (H1a/H1b/H2/H2C/H3)"
status = "failed"
verdict = "H1b FAILED OOS economic gate (IC 0.0207 significant, net < 0); H2C/H3 in progress"
entry = "quant_research.strategies.sentiment_returns.oos_runner"
findings = "research/sentiment_returns/FINDINGS.md"

[data]
root_env = "QR_DATA_DIR"
requires = ["av news sentiment", "bars/daily"]

# H2-C library parameters (quant_research.strategies.sentiment_returns.h2c). Method constants only, per the
# pre-registration; holdout expected counts are runtime inputs ($QR_H2C_HOLDOUT_EXPECTED), never stored here.
[h2c]
universe = ["AAPL", "ABBV", "ADBE", "AMD", "AMZN", "AVGO", "BA", "BAC", "C", "CAT", "CMCSA", "COST", "CRM", "CSCO",
            "CVX", "DIS", "GE", "GOOGL", "GS", "HD", "HON", "INTC", "JNJ", "JPM", "KO", "LLY", "MA", "MCD", "META",
            "MRK", "MS", "MSFT", "NFLX", "NKE", "NVDA", "ORCL", "PEP", "PFE", "PG", "QCOM", "SBUX", "T", "TSLA",
            "TXN", "UNH", "V", "VZ", "WFC", "WMT", "XOM"]
hedge = "SPY"
beta_n = 252
h0 = 1
h1 = 21
lag = 100
nprior_max = 4
nprior_min = 2
tone_min = 10
q_min_events = 20
quantile_div = 5
cost_side = 0.0010
cost_side_sens = 0.0020
borrow = 0.10
nw_lag = 1
g1_min_t = 2.0
g2_alpha = 0.01
g2_ic_frac = 0.5

[h2c.partitions.DEV]
lo = "2014-01-01"
hi = "2020-12-31"
score_lo = "2015-01-01"
scored_years = [2015, 2020]
g0_min_quarters = 22
purge_window = ["2020-11-01", "2020-12-31"]
purge_boundary = "2020"

[h2c.partitions.HOLDOUT]
lo = "2010-01-01"
hi = "2013-12-31"
score_lo = "2011-01-01"
scored_years = [2011, 2013]
g0_min_quarters = 11
purge_window = ["2013-11-01", "2013-12-31"]
purge_boundary = "2013"
exclude_mapped_before = "2010-01-01"
