# Trial config. Strategy parameters are frozen (pre-registered) constants in the code;
# this file records the entry point, status and data needs.

[trial]
title = "Statarb bellwether H1/H2"
status = "in_progress"
verdict = "v3 proposed; runner dry-pass only, no returns"
entry = "quant_research.strategies.statarb_bellwether.backtest_h1_h2_v1_3f"
findings = "research/statarb_bellwether/FINDINGS.md"

[data]
root_env = "QR_DATA_DIR"
requires = ["av daily adjusted"]

# Input paths and sha256 pins for the frozen runner. All PENDING here, so the runner refuses
# (exit 17 at import). Fill them in a private copy outside the repo and point
# $QR_STATARB_BELLWETHER_CONFIG at it. Path values may use ${QR_DATA_DIR}, ${QR_DESK_DIR},
# ${HOME_DIR} and ${QR_COSTS_DIR}. Never commit filled-in paths or pins.
[pins]
NP_SITE = "PENDING"
NP_RECORD_REL = "PENDING"
NP_VERSION = "PENDING"
NP_RECORD_SHA256 = "PENDING"
