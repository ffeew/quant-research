name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Compile
        run: uv run python -m compileall -q src tests scripts
      - name: Test
        run: uv run pytest
